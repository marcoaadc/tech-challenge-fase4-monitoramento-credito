[project]
name = "creditwatch"
version = "1.1.1"
description = "Sustentacao e confiabilidade de um modelo de credit scoring: contratos de dados (Pandera), deteccao de drift (Evidently), observabilidade (MLflow, Prometheus) e governanca LGPD"
authors = [{ name = "Marco", email = "marcoaadc@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scipy (>=1.13,<2.0)",
    "pyarrow (>=16,<24)",
    "scikit-learn (>=1.5,<1.9)",
    "xgboost (>=2.1,<4.0)",
    "pandera[pandas] (>=0.24,<1.0)",
    "evidently (>=0.7.11,<0.8)",
    "mlflow (>=3.1,<4.0)",
    "prometheus-client (>=0.20,<1.0)",
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "plotly (>=5.24,<7.0)",
    "jinja2 (>=3.1,<4.0)",
    "joblib (>=1.4,<2.0)",
    "xlrd (>=2.0.1,<3.0)",
]

[tool.poetry]
packages = [{ include = "creditwatch", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "models", "reports", "mlruns", "mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM", "C4", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["creditwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testes que rodam o pipeline completo (mais lentos)",
    "evidently: testes que geram um relatorio real do Evidently",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/creditwatch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
